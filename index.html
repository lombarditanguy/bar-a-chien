<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐶 Bar à Chiens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bandeau du haut : compteur de pièces toujours visible -->
  <header id="topbar">
    <div class="coin-box">
      <span class="coin-icon">🪙</span>
      <span id="coin-count">0</span>
    </div>
    <div class="income-box" id="income-rate">+0 /s</div>
  </header>

  <!-- La scène du bar : mur, comptoir, porte, coussins, clients -->
  <main id="bar">
    <div id="scene">
      <div id="bar-title">🐾 Bar à Chiens 🐾</div>
      <div id="decor"></div>
      <div id="counter">
        <span id="barman">🧑‍🍳</span>
        <span class="counter-drinks">🍹🥤🧋</span>
      </div>
      <div id="door">🚪</div>
      <div id="cushions"></div>
      <div id="hint" class="hidden">👇 Adopte ton premier chien !</div>
    </div>
  </main>

  <!-- Boutique en bas : gros boutons, peu de texte -->
  <footer id="shop">
    <button id="btn-adopt" class="shop-btn">
      <span class="shop-emoji">🐶</span>
      <span class="shop-label">Adopter</span>
      <span class="shop-cost" id="cost-adopt">🪙 10</span>
    </button>
    <button id="btn-kibble" class="shop-btn">
      <span class="shop-emoji">🍖</span>
      <span class="shop-label">Croquettes <span id="lvl-kibble" class="lvl"></span></span>
      <span class="shop-cost" id="cost-kibble">🪙 50</span>
    </button>
    <button id="btn-expand" class="shop-btn">
      <span class="shop-emoji">🏠</span>
      <span class="shop-label">Agrandir</span>
      <span class="shop-cost" id="cost-expand">🪙 100</span>
    </button>
  </footer>

  <!-- Popup "bon retour" : gains hors-ligne -->
  <div id="welcome-back" class="modal hidden">
    <div class="modal-card">
      <div class="modal-emoji">🐕💤</div>
      <p>Des clients sont passés pendant ton absence !</p>
      <p class="modal-coins">+<span id="offline-coins">0</span> 🪙</p>
      <button id="btn-collect" class="big-btn">Récupérer !</button>
    </div>
  </div>

  <!-- Popup d'adoption : choix de la race (déblocage inclus) -->
  <div id="adopt-modal" class="modal hidden">
    <div class="modal-card">
      <p class="modal-title">Choisis un chien !</p>
      <div id="breed-list"></div>
      <button id="btn-adopt-close" class="small-btn">Fermer</button>
    </div>
  </div>

  <!-- Popup d'un chien : nom + accessoires -->
  <div id="dog-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-emoji" id="dog-modal-emoji">🐶</div>
      <input id="name-input" type="text" maxlength="14" autocomplete="off">
      <p class="dog-income-line">✨ attire <span id="dog-modal-income">0</span> 🪙 /s</p>
      <div id="acc-list"></div>
      <button id="btn-dog-ok" class="big-btn">Super !</button>
    </div>
  </div>

  <button id="btn-sound" title="Son">🔊</button>
  <button id="btn-reset" title="Réinitialiser la partie">🔄</button>

  <!-- Ordre de chargement important (pas de modules ES pour rester jouable en file://) -->
  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="game.js"></script>
  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="customers.js"></script>
  <script src="main.js"></script>
</body>
</html>
